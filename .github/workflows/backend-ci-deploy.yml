name: Backend CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Check out CafeLauncher
        uses: actions/checkout@v7
        with:
          repository: fabjoncela/Cs-script
          path: launcher
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run backend tests
        run: python -m unittest -v test_backend
      - name: Check viewer and launcher schema parity
        run: python tools/check_launcher_schema.py --launcher-root launcher

  deploy:
    name: Deploy tested main revision
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, cafe-backend-deploy]
    environment: production
    timeout-minutes: 10
    concurrency:
      group: cafelauncher-backend-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy exact tested revision and roll back if verification fails
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: printf '%s\n' "$DEPLOY_SHA" | sudo -n /usr/local/sbin/cafelauncher-backend-deploy
